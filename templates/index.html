<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatBot | Bienvenido</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f8f0fb;
        }

        .hero {
            padding: 80px 20px;
            text-align: center;
        }

        .card {
            border-radius: 20px;
            background: #fff;
            border: none;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #6b4f8a;
            font-weight: 700;
        }

        p {
            color: #8e78a9;
        }

        .btn-pastel {
            background-color: #c6b6f3;
            color: #fff;
            border-radius: 25px;
            padding: 10px 25px;
        }

        .btn-pastel:hover {
            background-color: #b4a3e6;
            color: #fff;
        }

        footer {
            margin-top: 60px;
            color: #a088ba;
        }
    </style>
</head>

<body>

    <div class="container hero">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-5">
                    <h1 class="mb-3">Bienvenido a ChatBot</h1>
                    <p class="lead">
                        Tu asistente en tiempo real con tecnología moderna, sockets y autenticación segura.
                    </p>

                    <div class="mt-4">
                        <a href="{% url 'login' %}" class="btn btn-pastel me-3">Iniciar Sesión</a>
                        <a href="{% url 'register' %}" class="btn btn-outline-secondary" style="border-radius:25px;">
                            Registrarse
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <footer class="text-center mt-5">
            &copy;
            <script>document.write(new Date().getFullYear());</script> ChatBot • Desarrollado con Django + Bootstrap
        </footer>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
